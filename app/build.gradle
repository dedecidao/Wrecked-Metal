plugins {
    id 'com.android.application'
}

def abis = (project.findProperty('dd64.abis') ?: 'armeabi-v7a,arm64-v8a').split(',')*.trim()
def arm64Link = (project.findProperty('dd64.arm64Link') ?: 'false').toBoolean()
def probe = (project.findProperty('dd64.probe') ?: 'false').toBoolean()

// The Wrecked Metal release key (Costelinha Games). Never in the repository: CI gets it
// from the WM_KEYSTORE_* secrets, a local build from ~/.wreckedmetal/signing.properties
// (or -Pwm.signing=<file>). Without it the release APK is signed with the debug key.
def releaseSigning = null
if (System.getenv('WM_KEYSTORE_FILE')) {
    releaseSigning = [storeFile: System.getenv('WM_KEYSTORE_FILE'),
                      storePassword: System.getenv('WM_KEYSTORE_PASSWORD'),
                      keyAlias: System.getenv('WM_KEY_ALIAS') ?: 'wreckedmetal',
                      keyPassword: System.getenv('WM_KEY_PASSWORD') ?: System.getenv('WM_KEYSTORE_PASSWORD')]
} else {
    def f = file(project.findProperty('wm.signing') ?: "${System.getProperty('user.home')}/.wreckedmetal/signing.properties")
    if (f.isFile()) {
        def p = new Properties()
        f.withInputStream { p.load(it) }
        releaseSigning = [storeFile: p.storeFile, storePassword: p.storePassword,
                          keyAlias: p.keyAlias, keyPassword: p.keyPassword]
    }
}

android {
    namespace = 'io.github.dedecidao.dd64'
    compileSdk = 35
    ndkVersion = '27.2.12479018'

    defaultConfig {
        applicationId = 'com.costelinhagames.wreckedmetal'
        // 29 (Android 10): native ELF TLS. Below it the NDK emulates TLS, and the shadow
        // hooks' __thread state (port/src/shadow.c, every game memory access) went through
        // __emutls_get_address: track loading took minutes
        minSdk = 29
        targetSdk = 35
        versionCode = 4
        versionName = '0.1.3'

        ndk {
            abiFilters.addAll(abis)
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          "-DDD64_ARM64_LINK=${arm64Link ? 'ON' : 'OFF'}",
                          "-DDD64_PROBE=${probe ? 'ON' : 'OFF'}"
                // libSDL3.so, libdd64.so, and libdd64reserve.so for wrap.sh
                targets 'SDL3-shared', 'dd64', 'dd64reserve'
            }
        }
    }

    // SDL's own Java side (SDLActivity and friends), from the submodule
    sourceSets {
        main {
            java.srcDirs += ['../external/SDL/android-project/app/src/main/java']
        }
        // wrap.sh (lib/armeabi-v7a), which reserves the game's RAM at 0x80000000: the
        // release build needs it as much as the debug one (not the debug manifest)
        release {
            resources.srcDirs += ['src/debug/resources']
        }
    }

    signingConfigs {
        if (releaseSigning != null) {
            release {
                storeFile = file(releaseSigning.storeFile)
                storePassword = releaseSigning.storePassword
                keyAlias = releaseSigning.keyAlias
                keyPassword = releaseSigning.keyPassword
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable = true
            jniDebuggable = true
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
            // Signed with the Wrecked Metal key when there is one (CI, the maintainer's PC),
            // so a debug build from CI installs over one built on the PC and the next CI build
            // over that, keeping the debug app's imported ROM. Without the key: the debug key
            signingConfig = releaseSigning != null ? signingConfigs.release : signingConfigs.debug
        }
        release {
            minifyEnabled = false
            // Debuggable because Android only runs wrap.sh (the 0x80000000 reservation the
            // 32-bit build needs) for debuggable apps. Fine for APKs from GitHub; a store
            // build waits for arm64 (no reservation needed there) or another reservation.
            debuggable = true
            signingConfig = releaseSigning != null ? signingConfigs.release : signingConfigs.debug
            // The native code as the debug build has it (the game's own files are -O2 in both,
            // CMakeLists.txt): with CMake's RelWithDebInfo (SDL at -O2, NDEBUG) the 60 Hz clocks
            // woke late and a race doubled ~1.5% of its frames on a Galaxy S23 Ultra, against
            // ~0.1% for the debug build, same phone, same race, same moment (20/11)
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Debug'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // keep symbols in the debug APK for crash logs
            keepDebugSymbols += ['**/*.so']
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError = false
    }
}
