name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: APK (armeabi-v7a, full game)
    runs-on: ubuntu-24.04
    env:
      # The Wrecked Metal release key exists only as this repository's secrets (not in
      # forks, not for pull requests from forks): without it the signed APK is skipped
      HAS_RELEASE_KEY: ${{ secrets.WM_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove SDL's sample Gradle wrapper
        # external/SDL/android-project ships a gradle-wrapper.jar for SDL's own sample
        # project. This build never runs it (it uses the Gradle set up below), and
        # gradle/actions cannot match its checksum, so it is deleted from the checkout.
        run: rm -f external/SDL/android-project/gradle/wrapper/gradle-wrapper.jar

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Tools
        # GNU objdump for 32-bit ARM ELF: tools/port/gen_widths.py reads the game objects' DWARF with it
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-linux-gnueabihf ninja-build

      - name: Release key (signs the debug and the release APK)
        # One key for both, so each CI debug build installs over the last one (and over a
        # debug build from the maintainer's PC) without uninstalling and losing its ROM
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          WM_KEYSTORE_BASE64: ${{ secrets.WM_KEYSTORE_BASE64 }}
        run: |
          echo "$WM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wm.p12"
          echo "WM_KEYSTORE_FILE=$RUNNER_TEMP/wm.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          WM_KEYSTORE_PASSWORD: ${{ secrets.WM_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dd64-android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Signed release APK (the Wrecked Metal key)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          WM_KEYSTORE_PASSWORD: ${{ secrets.WM_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/wm.p12"

      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_KEY == 'true'
        with:
          name: wreckedmetal-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  arm64-check:
    name: arm64-v8a (probe APK + conversion status)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove SDL's sample Gradle wrapper
        # external/SDL/android-project ships a gradle-wrapper.jar for SDL's own sample
        # project. This build never runs it (it uses the Gradle set up below), and
        # gradle/actions cannot match its checksum, so it is deleted from the checkout.
        run: rm -f external/SDL/android-project/gradle/wrapper/gradle-wrapper.jar

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: arm64 address-space probe APK
        # A stand-in libdd64.so that checks the RAM image can be mapped at 0x80000000
        # in a 64-bit process (android/probe.c)
        run: |
          gradle --no-daemon -Pdd64.abis=arm64-v8a -Pdd64.probe=true assembleDebug
          mkdir -p probe && cp app/build/outputs/apk/debug/*.apk probe/dd64-arm64-probe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dd64-arm64-probe-apk
          path: probe/dd64-arm64-probe.apk

      - name: arm64 conversion status (informational)
        # The game's C is not converted to 64-bit yet (docs/ARM64.md), so this build is
        # expected to fail; its errors are the to-do list, written to the job summary.
        # It turns into a required check once the conversion links.
        id: arm64
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon -Pdd64.abis=arm64-v8a -Pdd64.probe=false externalNativeBuildDebug 2>&1 | tee arm64.log

      - name: arm64 conversion summary
        if: always()
        run: |
          {
            echo "## arm64-v8a conversion"
            if [ "${{ steps.arm64.outcome }}" = success ]; then
              echo "The native code builds for arm64-v8a."
            else
              echo "Not converted yet (expected, docs/ARM64.md). Compiler errors:"
              echo '```'
              grep -E "error:" arm64.log | sed 's/.*external\/dd64\///' | sort | uniq -c | sort -rn | head -40 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  nightly:
    # The latest APKs from main as a rolling pre-release, so a phone (or adb on a
    # PC) can download them without signing in to GitHub
    name: Publish nightly pre-release
    needs: [apk, arm64-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p out
          # the signed APK (the one players install) when the release key is set up
          if ls dl/wreckedmetal-release-apk/*.apk >/dev/null 2>&1; then cp dl/wreckedmetal-release-apk/*.apk out/wreckedmetal-armeabi-v7a.apk; fi
          cp dl/dd64-android-debug-apk/*.apk out/wreckedmetal-armeabi-v7a-debug.apk
          if [ -f dl/dd64-arm64-probe-apk/dd64-arm64-probe.apk ]; then cp dl/dd64-arm64-probe-apk/dd64-arm64-probe.apk out/; fi
          gh release delete nightly --repo "$REPO" --yes --cleanup-tag || true
          gh release create nightly out/*.apk --repo "$REPO" --prerelease --target "$GITHUB_SHA" \
            --title "Nightly (${GITHUB_SHA::7})" \
            --notes "Automatic builds of the latest commit on main. Install wreckedmetal-armeabi-v7a.apk (the -debug one is for testing). No ROM data included: pick your own ROM in the app."

  release:
    # A tag v* publishes a GitHub Release with the signed APK and the notes in
    # .github/release-notes/<tag>.md (a tag with a "-", like v0.1.0-beta, is a pre-release)
    name: Publish tagged release
    needs: [apk]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wreckedmetal-release-apk
          path: dl
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/$TAG.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          mkdir -p out
          cp dl/*.apk "out/wrecked-metal-$TAG-armeabi-v7a.apk"
          title="$(sed -n 's/^# //p' "$notes" | head -1)"
          tail -n +2 "$notes" > out/notes.md
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" out/*.apk --repo "$REPO" $pre --verify-tag \
            --title "$title" --notes-file out/notes.md
